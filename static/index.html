<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Eric Hobson - Software Developer specializing in iOS development and systems programming. Former chef turned developer, building thoughtful solutions with technical excellence.">
    <meta name="author" content="Eric Hobson">
    <meta property="og:title" content="Eric Hobson - Software Developer">
    <meta property="og:description"
        content="Former chef turned software developer. Building thoughtful solutions that balance technical excellence with human-centered design.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://erichobson.com">
    <title>Eric Hobson - Software Developer</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&family=Syne:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@0.475.0/dist/umd/lucide.min.js"></script>

</head>

<body>
    <a href="#main" class="skip-to-main">Skip to main content</a>
    <header>
        <div class="scroll-progress" aria-hidden="true">
            <div class="scroll-progress__bar" id="scrollProgressBar"></div>
        </div>
        <nav class="container" aria-label="Primary">
            <div class="nav-brand">
                <a class="logo" id="navLogo" href="#hero">Dev</a>
                <span class="nav-status" id="navStatus" hidden>
                    <span class="nav-status__sep" aria-hidden="true"></span>
                    <span class="nav-status__text"></span>
                </span>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="#about">About</a></li>
                <li><a href="#work">Work</a></li>
                <li><a href="#experience">Experience</a></li>
            </ul>
        </nav>
    </header>

    <main id="main">
        <section class="hero" id="hero">
            <div class="hero-bg">
                <canvas class="constellation-canvas" id="constellationCanvas"></canvas>
            </div>

            <div class="container">
                <div class="hero-content">
                    <h1 id="heroName"></h1>
                    <p class="hero-tagline" id="heroTagline"></p>
                    <div class="social-links" id="socialLinks"></div>
                </div>
            </div>
        </section>
        <section id="about" class="fade-in">
            <div class="container">
                <div class="section-header">
                    <h2>About</h2>
                    <div class="divider"></div>
                </div>
                <div class="about-content">
                    <div class="about-bio">
                        <p id="aboutBio"></p>
                    </div>
                    <div class="about-tags about-tags--skills" id="aboutSkills"></div>
                    <div class="about-tags about-tags--interests" id="aboutInterests"></div>
                </div>
            </div>
        </section>
        <section id="work" class="fade-in">
            <div class="container">
                <div class="section-header">
                    <h2>Selected Work</h2>
                    <div class="divider"></div>
                </div>
                <div class="filter-container" id="filterContainer"></div>
                <div class="projects-grid fade-in-stagger" id="projectsGrid"></div>
            </div>
        </section>
        <section id="experience" class="fade-in">
            <div class="container">
                <div class="section-header">
                    <h2>Experience</h2>
                    <div class="divider"></div>
                </div>
                <div class="experience-timeline fade-in-stagger" id="experienceTimeline"></div>
            </div>
        </section>
    </main>
    <footer>
        <div class="container">
            <div class="footer-content">
                <p class="footer-text">&copy; <span id="footerYear"></span> <span id="footerName"></span></p>
            </div>
        </div>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="Back to top">&uarr;</button>

    <script src="js/main.js"></script>
</body>

</html>
