<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Jello Train Physics Simulation - Eric Hobson</title>
    <link rel="stylesheet" type="text/css" href="style.css">

  </head>
  <body>
    <div id="header">
      <a id="logo" href="/" style="text-decoration: none; font-family: sans-serif; font-weight: 600; font-size: 16px; color: #333;">&larr; Back to Portfolio</a>

      <div class="spinner" id='spinner'></div>
      <div class="emscripten" id="status">Downloading...</div>

      <span id='controls'>
      <span><input type="checkbox" id="resize">Resize canvas</span>
      <span><input type="checkbox" id="pointerLock" checked>Lock/hide mouse pointer &nbsp;&nbsp;&nbsp;</span>
      <span><input type="button" id="fullscreenButton" value="Fullscreen"></span>
    </span>

    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>

    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" tabindex=-1></canvas>
    </div>
    <textarea id="output" rows="8"></textarea>

    <script async type="text/javascript" src="app.js"></script>
    <script async type="text/javascript" src="index.js"></script>
  </body>
</html>
